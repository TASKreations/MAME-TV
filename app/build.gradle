plugins { id 'com.android.application' }

android {
    namespace 'com.taskreations.mametv'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.taskreations.mametv'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-mame0.78'
        testInstrumentationRunner 'com.taskreations.mametv.SmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { ndkBuild { arguments '-j3', 'GIT_VERSION=ca185b1' } }
    }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
